<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- Character encoding for the document and used by browser  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <div>  <!-- This div act as a container in which we create our application -->
    <h1>Notes</h1>  <!-- Heading for the notes section range from h1 to h6 -->  
    <p>Hello world</p> <!-- Paragraph tag to add text content and also has margin as compared to div -->
    <span></span> <!-- Span tag is an inline container used to mark up a part of a text or a part of a document -->
   <p>Hi My name is Rishabh <span>Gulati</span></p> <!-- Span used inside paragraph to style part of the text differently --> 
      </div>
    <br> <!-- Line break tag to create a break in the content -->
    <hr> <!-- Horizontal rule tag to create a thematic break in the content -->
    strong <!-- Strong tag to indicate strong importance, typically displayed in bold -->
    <em> <!-- Emphasis tag to indicate emphasis, typically displayed in italics --> 

</body>
</html>
