# it is a pattern in gitops which helps manage multiple applications
# After App of Apps:
#You create one app, and it creates everything else.

This is the moment where your setup turns from “projects” into a **platform**.

Right now:
You create apps one by one.

After App of Apps:
You create **one app**, and it creates everything else.

Hierarchy:

```
Root App (bootstrap)
   ↓
Child Apps (flask-dev, flask-staging, flask-prod, later monitoring, ingress, etc.)
      ↓
Real workloads
```

Git controls the root.
Root controls the universe.

---

First, go to your GitOps repo:

```bash
cd ~/argocd-gitops-repo
```

Create structure:

```bash
mkdir -p bootstrap/apps
cd bootstrap
```

Now your repo will look like:

```
argocd-gitops-repo/
├── flask-app/
│   ├── base/
│   └── overlays/
│       ├── dev
│       ├── staging
│       └── prod
└── bootstrap/
    ├── apps/
    └── root-app.yaml   (we’ll create this)
```

---

Now move your existing ArgoCD Application YAMLs into Git.

Earlier you created these locally:

* flask-dev.yaml
* flask-staging.yaml
* flask-prod.yaml

Put them inside:

```bash
mv ~/argocd-apps/flask-dev.yaml bootstrap/apps/
mv ~/argocd-apps/flask-staging.yaml bootstrap/apps/
mv ~/argocd-apps/flask-prod.yaml bootstrap/apps/
```

Edit each file slightly.

Open one:

```bash
nano bootstrap/apps/flask-dev.yaml
```

Make sure it has:

```yaml
spec:
  project: dev-project
  source:
    repoURL: https://github.com/<your-username>/argocd-gitops-repo.git
    path: flask-app/overlays/dev
```

Same idea for:

* staging → staging-project → overlays/staging
* prod → prod-project → overlays/prod

These are your **child apps**.

---

Now create the root app.

```bash
nano bootstrap/root-app.yaml
```

Put this:

```yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<your-username>/argocd-gitops-repo.git
    targetRevision: HEAD
    path: bootstrap/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
```

This app says:

> “Look into `bootstrap/apps`, and create everything you find there as ArgoCD Applications.”

That’s App of Apps.

---

Now commit everything:

```bash
git add .
git commit -m "Add App of Apps bootstrap structure"
git push origin main
```

---

Now we clean the cluster.

Delete your manually created apps:

```bash
argocd app delete flask-dev
argocd app delete flask-staging
argocd app delete flask-prod
```

Wait till they disappear from UI.

---

Now apply only ONE thing:

```bash
kubectl apply -f bootstrap/root-app.yaml
```

Watch ArgoCD UI.

You will see:

1. root-bootstrap app appears
2. It syncs
3. It creates:

   * flask-dev
   * flask-staging
   * flask-prod
4. Those apps then sync and deploy workloads

You just created a self-reproducing GitOps platform.

No more:

```
kubectl apply app1.yaml
kubectl apply app2.yaml
kubectl apply app3.yaml
```

Only:

```
kubectl apply root-app.yaml
```

---

This is App of Apps pattern.

You now have:

* One entry point
* One Git repo
* One root app
* Infinite child apps

This is how:

* platform teams
* internal developer platforms
* multi-tenant clusters
  are actually managed.

Once you see root-bootstrap creating everything, just say:

> the root is alive

Then we move to Phase 2:
**Making your GitHub repos private and wiring ArgoCD with SSH authentication.**
