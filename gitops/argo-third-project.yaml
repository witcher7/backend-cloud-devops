cd ~
mkdir argocd-apps
cd argocd-apps
---

# CREATE DEV app
nano flask-dev-app.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<your-username>/argocd-gitops-repo.git
    targetRevision: HEAD
    path: flask-app/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---

