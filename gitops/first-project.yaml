

# ```
# https://github.com/argoproj/argocd-example-apps.git
# ```

# In ArgoCD UI:

# Click **“New App”**

# Fill like this:

# Application Name:

# ```
# first-gitops-app
# ```

# Project:

# ```
# default
# ```

# Sync Policy:

# * Manual (for now, we’ll go auto later)

# Repository URL:

# ```
# https://github.com/argoproj/argocd-example-apps.git
# ```

# Revision:

# ```
# HEAD
# ```

# Path:

# ```
# guestbook
# ```

# Cluster:

# ```
# https://kubernetes.default.svc
# ```

# Namespace:

# ```
# default
# ```

# Then click **Create**.

# You’ll see your app appear as **OutOfSync** and **Missing**.
# That’s Git saying: “Hey, I know what should exist, but it’s not in your cluster yet.”

# Now click on the app → hit **Sync** → confirm.

# Watch the magic:

# * Yellow → Green
# * Missing → Healthy

# This is your first real GitOps moment:


