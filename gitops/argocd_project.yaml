Before we touch users and RBAC, we draw boundaries.
Projects are those boundaries.

Right now everything lives in `default` project. That’s wild-west mode.

We’ll create three:

* `dev-project`
* `staging-project`
* `prod-project`

Each one will:

* Allow only one namespace
* Allow only your GitOps repo
* Protect environments from each other

This is how big orgs prevent “oops I deployed prod into dev”.

---

Create dev project:

```bash
nano dev-project.yaml
```

```yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev-project
  namespace: argocd
spec:
  description: Dev environment project
  sourceRepos:
    - https://github.com/<your-username>/argocd-gitops-repo.git
  destinations:
    - namespace: dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
```

Apply:

```bash
kubectl apply -f dev-project.yaml
```

---

