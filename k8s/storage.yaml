#CSI ==? A way to use storage like (hard drives ) on kubernetes
# CSI stands for Container Storage Interface. It is a standard for exposing arbitrary block and file storage systems to containerized workloads on Kubernetes (and other container orchestration systems).
# Gives the ability to use storage, which is called volumes in kubernetes, in a consistent way across different storage providers.
# Various storage interfaces available 
# it is a plugin much like CNI for networking and CRI for container runtimes.
 
## STORAGE CLASS
# A StorageClass provides a way for administrators to describe the "classes" of storage they offer.
# Different classes might map to quality-of-service levels, or to backup policies, or to arbitrary policies determined by the cluster administrators.
# Each StorageClass contains the fields provisioner, parameters, and reclaimPolicy, which are used when a PersistentVolume belonging to the class is dynamically provisioned.
# When no StorageClass is specified, the default StorageClass for the cluster is used.
# A cluster may have multiple StorageClasses.
# StorageClasses are non-namespaced; they exist at the cluster level. 
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast
provisioner: kubernetes.io/aws-ebs # example for AWS EBS
parameters: 
  type: gp2
  fsType: ext4
reclaimPolicy: Retain # Retain, Delete, Recycle means what happens to the volume when released from its claim  
mountOptions:
  - debug # mount options for the volume  
volumeBindingMode: Immediate # Immediate or WaitForFirstConsumer
allowVolumeExpansion: true # allow resizing of the volume 
# end of storageclass

## PERSISTENT VOLUME  
# A PersistentVolume (PV) is a piece of storage in the cluster that has been provisioned by an administrator or dynamically provisioned using Storage Classes.
# It is a resource in the cluster just like a node is a cluster resource.
# PVs are volume plugins like Volumes, but have a lifecycle independent of any individual Pod that uses the PV.
# This API object captures the details of the implementation of the storage, be it NFS, iSCSI, or a cloud-provider-specific storage system.
--- 
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-volume
spec:
  capacity: 
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fast
  hostPath: 
     path: /mnt/data
# end of persistent volume

# PersistenVolumeReclaimPolicy
# Retain: manual reclamation required 
# If a user deletes persistent volume claim (PVC) that is bound to a persistent volume (PV) with a Retain reclaim policy, the PV will not be deleted. Instead, it will enter a Released state, 
# indicating that the PV is no longer bound to a PVC but still contains data. The administrator must manually handle the cleanup and reclamation of the PV.

# Recycle: basic scrub (delete data)
# If a user deletes a PVC that is bound to a PV with a Recycle reclaim policy, the PV will be scrubbed using a basic delete operation (rm -rf /thevolume/*) and then made available for a new claim.
# Note: The Recycle reclaim policy is deprecated in newer versions of Kubernetes and is not recommended for production use.

# Delete: automatic deletion
# If a user deletes a PVC that is bound to a PV with a Delete reclaim policy, the associated PV will be automatically deleted along with the underlying storage asset.
# This is commonly used with dynamically provisioned volumes, where the storage is created and managed by the cluster.  

## PERSISTENT VOLUME CLAIM
# A PersistentVolumeClaim (PVC) is a request for storage by a user.
# It is similar to a Pod. Pods consume node resources and PVCs consume PV resources.
# Pods can request specific levels of resources (CPU and Memory); PVCs can request specific sizes and access modes (e.g., can be mounted once read/write or many times read-only).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-volume
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: fast
# end of persistent volume claim

## USING PVC IN A POD
# A Pod can use a PersistentVolumeClaim as a volume.
---
apiVersion: v1
kind: Pod
metadata:   
  name: mypod
spec:
  containers:
    - name: myfrontend
      image: nginx      
      volumeMounts:
        - mountPath: "/usr/share/nginx/html"
          name: mypdv
  volumes:
    - name: mypdv
      persistentVolumeClaim:
        claimName: pvc-volume
# end of pod using pvc  


## Mental model (senior-level):

# CSI Driver = translator between Kubernetes ↔ cloud storage

# StorageClass = how volumes are created

# PVC = request for storage (by app)

# PV = actual volume (usually auto-created on EKS)

# Pod = mounts PVC → gets disk

# On EKS, we mostly use:

# AWS EBS CSI Driver (block storage, most common)

# Later: EFS (shared), FSx (high perf)

---

# EKS → IRSA → EBS CSI Driver

## Complete Notes (From Zero Cluster to CSI Pods Running)
---

## PHASE 1: Create EKS Cluster

```bash
eksctl create cluster \
  --name rg-cluster \
  --region ap-south-1 \
  --nodes 3 \
  --node-type t3.medium
```

Wait until it finishes.

Verify:

```bash
kubectl get nodes
```

---

## PHASE 2: Enable IAM OIDC Provider (MANDATORY FOR IRSA)

> Without this → CSI driver **cannot** assume IAM role

Check if OIDC exists:

```bash
aws eks describe-cluster \
  --name rg-cluster \
  --region ap-south-1 \
  --query "cluster.identity.oidc.issuer" \
  --output text
```

If empty / missing → attach it:

```bash
eksctl utils associate-iam-oidc-provider \
  --cluster rg-cluster \
  --region ap-south-1 \
  --approve
```

✅ This is **one-time per cluster**

---

## PHASE 3: Create IAM Role for EBS CSI Driver (IRSA)

This role allows Kubernetes to create EBS volumes.

```bash
eksctl create iamserviceaccount \
  --name ebs-csi-controller-sa \
  --namespace kube-system \
  --cluster rg-cluster \
  --role-name AmazonEKS_EBS_CSI_DriverRole \
  --attach-policy-arn arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy \
  --approve
```

Verify ServiceAccount:

```bash
kubectl get sa ebs-csi-controller-sa -n kube-system
```

Verify IAM annotation:

```bash
kubectl get sa ebs-csi-controller-sa -n kube-system -o yaml | grep eks.amazonaws.com
```

Expected:

```
eks.amazonaws.com/role-arn
```

---

## PHASE 4: Install EBS CSI Driver (EKS Addon)

### Get AWS Account ID

```bash
ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
```

### Install addon (IMPORTANT FLAGS)

```bash
aws eks create-addon \
  --cluster-name rg-cluster \
  --addon-name aws-ebs-csi-driver \
  --service-account-role-arn arn:aws:iam::$ACCOUNT_ID:role/AmazonEKS_EBS_CSI_DriverRole \
  --resolve-conflicts OVERWRITE \
  --region ap-south-1
```

Why `--resolve-conflicts OVERWRITE`?

* eksctl already created ServiceAccount
* addon must take ownership
* avoids CREATE_FAILED error

---

## PHASE 5: Verify Addon Status

### AWS-level check (source of truth)

```bash
aws eks describe-addon \
  --cluster-name rg-cluster \
  --addon-name aws-ebs-csi-driver \
  --region ap-south-1
```

Expected:

```
"status": "ACTIVE"
```

---

## PHASE 6: Verify CSI Pods (Kubernetes-level)

```bash
kubectl get pods -n kube-system | grep ebs
```

Expected:

* 2 × `ebs-csi-controller` → Running
* 1 × `ebs-csi-node` per worker node → Running

Example:

```
ebs-csi-controller   6/6   Running
ebs-csi-node         3/3   Running
```

---

## PHASE 7: Verify CSI Driver Registration

```bash
kubectl get csidrivers
```

Expected:

```
ebs.csi.aws.com
```

---

## FINAL STATE CHECKLIST (MEMORIZE THIS)

Before creating PVCs, ALL must be true:

* ✅ `kubectl get nodes` → Ready
* ✅ OIDC provider attached
* ✅ IRSA role created
* ✅ EBS CSI addon status = ACTIVE
* ✅ CSI pods running
* ✅ `ebs.csi.aws.com` present

Only **after this**:

* StorageClass
* PVC
* PV auto-creation
* EBS volume in AWS

