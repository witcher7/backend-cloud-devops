# PHASE 8: StorageClass → PVC → PV (hands-on)

At this point **CSI is running**, so Kubernetes can actually talk to EBS.

---

## Step 1 — Check existing StorageClasses (baseline)

```bash
kubectl get sc
```

You’ll probably see something like:

```
gp2 (default)
```

We **won’t use defaults**. Senior habit = explicit intent.

---

## Step 2 — Create your own StorageClass (gp3)

Create file:

```bash
vi storageclass-gp3.yaml
```

Paste **exactly this**:

```yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-sc
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
```

Apply it:

```bash
kubectl apply -f storageclass-gp3.yaml
```

Verify:

```bash
kubectl get sc
```

You should now see:

```
gp3-sc
```

📌 **Note for your notebook**

* `WaitForFirstConsumer` = volume created only when Pod exists
* avoids AZ mismatch
* default choice in prod EKS

---

## Step 3 — Create a PVC (request storage)

Create file:

```bash
vi pvc.yaml
```

Paste:

```yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-sc
  resources:
    requests:
      storage: 10Gi
```

Apply:

```bash
kubectl apply -f pvc.yaml
```

Check status:

```bash
kubectl get pvc
```

Expected:

```
STATUS: Pending
```

✅ **This is correct**

Why?

* No Pod is using it yet
* Volume creation is delayed

---

## Step 4 — Confirm no PV exists yet (important)

```bash
kubectl get pv
```

Expected:

```
No resources found
```

This proves:

> PVC alone does NOT create storage

---

## Step 5 — Deploy a Pod that uses the PVC (trigger moment)

Create deployment:

```bash
vi deployment.yaml
```

Paste:

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pvc-demo
  template:
    metadata:
      labels:
        app: pvc-demo
    spec:
      containers:
      - name: nginx
        image: nginx
        volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: app-pvc
```

Apply:

```bash
kubectl apply -f deployment.yaml
```

---

## Step 6 — Watch the magic happen

Run these **in order**:

```bash
kubectl get pods
```

Wait until Pod = `Running`.

Then:

```bash
kubectl get pvc
kubectl get pv
```

Now you should see:

* PVC → `Bound`
* PV → created automatically

🎯 **At this exact moment**:

* Kubernetes created a PV
* AWS created an EBS volume
* Volume attached to the node

---

## Step 7 — Verify EBS volume in AWS (real infra)

In AWS Console:

```
EC2 → Volumes
```

You’ll see:

* Type: `gp3`
* Size: `10 GiB`
* AZ = node AZ
* Attached to an EC2 instance

This is **not a simulation**.
You are creating real disks now.

---

## Step 8 — Prove persistence (non-negotiable test)

Write data:

```bash
kubectl exec -it deploy/pvc-demo -- bash
echo "hello from persistent storage" > /usr/share/nginx/html/index.html
exit
```

Delete the pod:

```bash
kubectl delete pod -l app=pvc-demo
```

Wait for new pod to start, then:

```bash
kubectl exec -it deploy/pvc-demo -- cat /usr/share/nginx/html/index.html
```

If text is still there → **PVC works**.

---

## Step 9 — Understand what you just proved (write this)

* Pod is ephemeral
* PVC is not
* PV survives pod restarts
* EBS volume survives pod deletion

This is why **databases work on Kubernetes**.

