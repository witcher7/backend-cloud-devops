# SCOPED AUTHENTICATION (optional advanced step)
# 3️⃣ Scoped Auth (NGINX-native, no extra tools)
# This is path-scoped basic authentication handled inside the ingress controller.
# What we’re enforcing
# All requests to /green must provide basic auth credentials
# Requests to /blue are open  
kind: Ingress
metadata:
  name: green-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /green
        pathType: Prefix
        backend:
          service:
            name: green-svc
            port:
              number: 80

