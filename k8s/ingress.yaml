# Ingress controllers is a collection of rules that allow inbound connections to reach the cluster services.
# An Ingress controller is responsible for fulfilling the Ingress, usually with a load balancer, though it may also configure your edge router or additional frontends to help handle the traffic.
# Ingress may provide load balancing, SSL termination and name-based virtual hosting.
# An Ingress controller is a specialized load balancer for Kubernetes (k8s) environments, managing external access to services in a cluster, typically HTTP.
# Ingress controllers watch the Kubernetes API server for updates to Ingress resource objects and reconfigure themselves accordingly.
# Popular Ingress controllers include NGINX, Traefik, and HAProxy.
# Ingress controllers can be deployed using various methods, including using kubectl to apply manifests or using Helm charts.
# Ingress controllers can be configured with various features, such as SSL termination, URL path routing, and rate limiting.
# Ingress controllers can also integrate with Kubernetes NetworkPolicy resources to enforce network policies for incoming traffic.
# NAMESPACE = ingress-system
# helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
# helm install ingress-nginx ingress-nginx/ingress-nginx --namespace ingress-system --create-namespace --set controller.publishService.enabled=true 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: myapp.example.com
    http:
      paths:    
      - path: /    
        pathType: Prefix
        backend:
          service:
            name: my-service
            port:
              number: 80  

# Traefik Ingress Controller installation using Helm
# helm repo add traefik https://helm.traefik.io/traefik
# helm install traefik traefik/traefik --namespace ingress-system --create-namespace  
# Note: The above configuration is just an example and may vary based on the specific Ingress controller being used and the requirements of the Kubernetes cluster.
# Traefik is another popular Ingress controller that provides advanced features such as dynamic configuration, service discovery, and middleware support.
# Traefik can be installed using various methods, including using kubectl to apply manifests or using Helm charts.
# Traefik also integrates with Kubernetes NetworkPolicy resources to enforce network policies for incoming traffic.
# Traefik Ingress example
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: myapp.example.com 
    http:
      paths:  
      - path: /  
        pathType: Prefix
        backend:
          service:
            name: my-service
            port:
              number: 80

