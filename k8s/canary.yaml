## 9️⃣ Show Canary LIVE (best demo moment)

Generate traffic:

```bash
for i in {1..50}; do curl -s http://localhost:8080/get > /dev/null; done
```

Now open **Kiali → Graph → micro**

What students should see:

* httpbin split into **v1 and v2**
* Thicker line to v1
* Thinner line to v2
* 🔒 lock icon (mTLS)

Say this:

> “This is a production-grade canary without touching application code.”

