# Istio Canary Deployment – Step by Step (from zero to Kiali graphs)

This is the full cinematic experience. No magic jumps. We install everything, deploy a microservice, release a canary, and watch traffic split live in Kiali like a responsible adult.

---

## 0. What we are building (so your brain stays calm)

* Kubernetes cluster (Minikube for sanity)
* Istio installed (istiod, ingress gateway, telemetry)
* Kiali dashboard
* One microservice (`app`) with **v1** and **v2**
* Canary release using **VirtualService + DestinationRule**
* Live traffic visualization in Kiali

Conceptually:

```
User → Istio Ingress → app-service → v1 (90%)
                                  → v2 (10%)
```

---

## 1. Prerequisites (do not skip or cry later)

* Docker installed
* kubectl installed
* Minikube installed
* 8 GB RAM minimum (Istio is not polite)

Start cluster:

```bash
minikube start --memory=8192 --cpus=4
```

Check:

```bash
kubectl get nodes
```

---

## 2. Install Istio (proper way, not cursed YAMLs)

### 2.1 Download Istio

```bash
curl -L https://istio.io/downloadIstio | sh -
cd istio-*
export PATH=$PWD/bin:$PATH
```

### 2.2 Install Istio with demo profile

Demo profile includes:

* Ingress Gateway
* Telemetry
* Kiali
* Prometheus
* Grafana

```bash
istioctl install --set profile=demo -y
```

Verify:

```bash
kubectl get pods -n istio-system
```

Everything should be `Running`. If not, stare at logs until it is.

---

## 3. Enable automatic sidecar injection

Create namespace for app:

```bash
kubectl create namespace canary-demo
kubectl label namespace canary-demo istio-injection=enabled
```

This ensures Envoy sidecars are injected automatically.

---

## 4. Create the microservice (v1 and v2)

We’ll use a simple HTTP app that returns version info.

### 4.1 app-v1 Deployment

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v1
  namespace: canary-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
      version: v1
  template:
    metadata:
      labels:
        app: app
        version: v1
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo
        args:
        - "-text=Hello from v1"
        ports:
        - containerPort: 5678
```

Apply:

```bash
kubectl apply -f app-v1.yaml
```

---

### 4.2 app-v2 Deployment (canary)

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v2
  namespace: canary-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
      version: v2
  template:
    metadata:
      labels:
        app: app
        version: v2
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo
        args:
        - "-text=Hello from v2 (canary)"
        ports:
        - containerPort: 5678
```

Apply:

```bash
kubectl apply -f app-v2.yaml
```

---

## 5. Create the Kubernetes Service

```yaml
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: canary-demo
spec:
  selector:
    app: app
  ports:
  - port: 80
    targetPort: 5678
```

Apply:

```bash
kubectl apply -f service.yaml
```

---

## 6. Expose via Istio Ingress Gateway

### 6.1 Gateway

```yaml
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: app-gateway
  namespace: canary-demo
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
```

Apply:

```bash
kubectl apply -f gateway.yaml
```

---

### 6.2 DestinationRule (versions definition)

```yaml
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: app-destination
  namespace: canary-demo
spec:
  host: app-service
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
```

Apply:

```bash
kubectl apply -f destinationrule.yaml
```

---

## 7. Canary traffic split (this is the money part)

### VirtualService – 90% v1, 10% v2

```yaml
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: app-virtualservice
  namespace: canary-demo
spec:
  hosts:
  - "*"
  gateways:
  - app-gateway
  http:
  - route:
    - destination:
        host: app-service
        subset: v1
      weight: 90
    - destination:
        host: app-service
        subset: v2
      weight: 10
```

Apply:

```bash
kubectl apply -f virtualservice.yaml
```

Congrats. You just did a real canary deployment.

---

## 8. Access the app

Get ingress IP:

```bash
kubectl get svc istio-ingressgateway -n istio-system
```

For Minikube:

```bash
minikube tunnel
```

Hit the endpoint repeatedly:

```bash
curl http://<EXTERNAL-IP>
```

You’ll see mostly `v1`, sometimes `v2`. That’s the canary behaving.

---

## 9. Install & open Kiali (visual dopamine)

### 9.1 Expose Kiali

```bash
istioctl dashboard kiali
```

Browser opens automatically.

### 9.2 What to click in Kiali

* Namespace: `canary-demo`
* Graph view
* Select **Traffic Animation**
* Set time range to `Last 1m`

You will see:

* app-service node
* v1 thicker line (90%)
* v2 thinner line (10%)

This is real Envoy-level traffic, not fake metrics.

---

## 10. Canary promotion (the grown-up move)

Change VirtualService to:

* v2 → 100%
* v1 → 0%

Apply and watch Kiali update live.

No redeploy. No downtime. No prayers.

---

## 11. Rollback (because production hates confidence)

Change weights back instantly.

This is why Istio exists.

---

## 12. What you actually learned (important)

* Sidecar injection
* Service vs subset vs version
* Gateway vs VirtualService
* Canary without CI/CD hacks
* Visual observability with Kiali

This is senior-level stuff, whether HR agrees or not.

