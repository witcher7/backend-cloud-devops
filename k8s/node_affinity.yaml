apiVersion: v1
kind: Pod
metadata:
  name: affinity-pod-example
spec:
  containers:
  - name: web-app
    image: nginx:latest
  affinity:
    nodeAffinity:
      # 1. HARD CONSTRAINT (Required)
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/region
            operator: In
            values:
            - us-east-1
            - us-west-2
          - key: disktype
            operator: Exists
      
      # 2. SOFT CONSTRAINT (Preferred)
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80
        preference:
          matchExpressions:
          - key: environment
            operator: In
            values:
            - production


