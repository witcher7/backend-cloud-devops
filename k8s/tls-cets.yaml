## CERT MANAGER 
# Cert-manager is a Kubernetes add-on that automates the issuance, renewal, and management of TLS/SSL certificates, reducing outages and simplifying security. It supports various issuers (Let's Encrypt, HashiCorp Vault, private CAs) and integrates with Kubernetes resources like Ingress to secure traffic. 
# Key Uses of Cert-Manager
# Automation of Certificate Lifecycles: Automatically requests, renews, and manages X.509 certificates for applications within a cluster.
# Kubernetes Ingress Security: Frequently used with NGINX or other Ingress controllers to enable HTTPS for web services.
# Secure Internal Communication: Manages certificates for inter-service communication (mTLS).
# Support for Multiple Issuers: Works with public authorities like Let's Encrypt, or private Certificate Authorities (CAs) such as HashiCorp Vault.
# Secret Management: Stores private keys and certificates securely as Kubernetes Secrets. 

