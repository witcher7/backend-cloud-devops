#   secretName: my-tls-cert-secret
apiVersion: v1
kind: Secret
metadata:       
  name: my-tls-cert-secret  
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: <base64-encoded-certificate>  # Base64 encoded TLS certificate
  tls.key: <base64-encoded-private-key>  # Base64 encoded TLS private key



