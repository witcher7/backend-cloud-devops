# CNI --> Container Network Interface
# This file configures the CNI plugins for container networking.
# CNI plugins are responsible for setting up the network interfaces in containers and managing their connectivity.
# CNI configuration files are typically located in /etc/cni/net.d/ directory on the host system.
# The configuration specifies the type of CNI plugin to use, its parameters, and any additional settings required for networking.
# A framework / plugin to make networking  a separate entity 
# Azure has its own CNI plugin for AKS clusters called Azure CNI which integrates with Azure networking features.

# AWS has its own CNI plugin for EKS clusters called Amazon VPC CNI which integrates with AWS VPC networking features.

# Cilium is a popular CNI plugin that provides advanced networking and security features for Kubernetes clusters.
# Calico is another widely used CNI plugin that offers networking and network policy capabilities for Kubernetes.
# Weave Net is a CNI plugin that provides simple and efficient networking for Kubernetes clusters. But not as popular as Calico or Cilium
# Flannel is a lightweight CNI plugin that provides basic networking for Kubernetes clusters. It is easy to set up and is often used in smaller clusters or development environments.
# But in Production clusters, Cilium and Calico are more popular due to their advanced features and scalability.
