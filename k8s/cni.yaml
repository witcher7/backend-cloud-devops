# CNI --> Container Network Interface
# This file configures the CNI plugins for container networking.
# CNI plugins are responsible for setting up the network interfaces in containers and managing their connectivity.
# CNI configuration files are typically located in /etc/cni/net.d/ directory on the host system.
# The configuration specifies the type of CNI plugin to use, its parameters, and any additional settings required for networking.
# A framework / plugin to make networking  a separate entity 
# Azure has its own CNI plugin for AKS clusters called Azure CNI which integrates with Azure networking features.

# AWS has its own CNI plugin for EKS clusters called Amazon VPC CNI which integrates with AWS VPC networking features.

# Cilium is a popular CNI plugin that provides advanced networking and security features for Kubernetes clusters.
# Calico is another widely used CNI plugin that offers networking and network policy capabilities for Kubernetes.
# Weave Net is a CNI plugin that provides simple and efficient networking for Kubernetes clusters. But not as popular as Calico or Cilium
# Flannel is a lightweight CNI plugin that provides basic networking for Kubernetes clusters. It is easy to set up and is often used in smaller clusters or development environments.
# But in Production clusters, Cilium and Calico are more popular due to their advanced features and scalability.

# CILIUM is ebpf based CNI plugin that provides advanced networking and security features for Kubernetes clusters.
# Cilium leverages eBPF (extended Berkeley Packet Filter) technology in the Linux kernel to provide high-performance networking and security capabilities.
# Cilium provides features such as network policies, load balancing, and service mesh capabilities.
# Cilium also integrates with Kubernetes to provide seamless networking and security for containerized applications.
> helm repo add cilium https://helm.cilium.io/
> helm install cilium cilium/cilium --version 1.13.3 --namespace kube-system

# CNI Configuration example for Cilium
apiVersion: cni.cncf.io/v1
kind: NetworkConfiguration
metadata:
  name: cilium-config
spec:
  cniVersion: 0.3.1     
  type: cilium-cni
  enableIPv4: true
  enableIPv6: false
  mtu: 1450
  ipam:
    type: cilium-ipam
    clusterPoolIPv4PodCIDR: "     
  
# Note: The above configuration is just an example and may vary based on the specific CNI plugin being used and the requirements of the Kubernetes cluster.
# Calico is another popular CNI plugin that provides networking and network policy capabilities for Kubernetes clusters.
# Calico supports both layer 3 networking and network policies, allowing for fine-grained control
# over pod-to-pod communication within the cluster.
# Calico can be installed using various methods, including using kubectl to apply manifests or using Helm charts.
# Calico also integrates with Kubernetes NetworkPolicy resources to enforce network policies for pods./16"
> helm repo add projectcalico https://docs.projectcalico.org/charts
> helm install calico projectcalico/tigera-operator --namespace kube-system
