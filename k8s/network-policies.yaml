# Network policies in Kubernetes
# Network policies are a way to control the communication between pods and services in a Kubernetes cluster.
# They allow you to define rules that specify which pods can communicate with each other and which cannot.
# Network policies are implemented using labels and selectors to identify the pods that the policy applies to.
# Firewall rules for pods
# control traffic at the IP address or port level (OSI model layer 3 or 4) 00> Ingress and Egress rules
# By default, all pods in a Kubernetes cluster can communicate with each other without any restrictions.
# When you create a network policy, it overrides the default behavior and restricts communication based on the defined rules.
# Network policies can be used to enhance the security of your Kubernetes cluster by limiting the attack surface and reducing the risk of lateral movement by attackers.
