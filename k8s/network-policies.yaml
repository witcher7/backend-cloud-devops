# Run pods
# kubectl run busybox1 --image=busybox --restart=Never --labels app=busybox1 -- sleep 3600
# kubectl run busybox2 --image=busybox --restart=Never --labels app=busybox2 -- sleep 3600
# kubectl get pods -o wide 
# run ping command to test connectivity
# kubectl exec -it busybox2 -- ping -c3 ip-of-busybox1-pod
# You should see successful ping responses

# Create a network policy that allows blocks all ingress traffic to busybox1 pod
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress-to-busybox1
spec:
  podSelector:
    matchLabels:
      app: busybox1
  policyTypes:  
  - Ingress
  ingress: []  # Empty ingress rules block all incoming traffic to the selected pods

# Test connectivity again
# kubectl exec -it busybox2 -- ping -c3 ip-of-busybox1-pod
# You should see ping requests time out, indicating that the busybox2 pod

