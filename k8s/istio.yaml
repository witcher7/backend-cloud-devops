# Now the REAL plan (hands-on, step by step)

We’ll build this:

```
Client
  ↓
Istio Ingress Gateway
  ↓
frontend (Node.js)
  ↓
backend (Go)
  ↓
database (mock or HTTP service)
```

Everything inside Istio. mTLS ON. Kiali watching.

---

## STEP 0: Cluster assumptions

* Kubernetes cluster ready (EKS / kind / minikube)
* kubectl configured
* You already know namespaces, deployments, services

Good. Moving on.

---

## STEP 1: Install Istio (minimal but real)

```bash
curl -L https://istio.io/downloadIstio | sh -
cd istio-*
export PATH=$PWD/bin:$PATH

istioctl install --set profile=demo -y
```

Verify:

```bash
kubectl get pods -n istio-system
```

If `istiod` isn’t running, stop here and fix your life.

---

## STEP 2: Enable sidecar injection

```bash
kubectl create namespace micro
kubectl label namespace micro istio-injection=enabled
```

This is **mandatory**. No label = no Envoy = no Istio.

---

## STEP 3: Deploy microservices

Example:

* frontend: Node.js (calls backend)
* backend: Go (returns JSON)

Deploy both into `micro` namespace. Normal Kubernetes YAML.

Check sidecars:

```bash
kubectl get pods -n micro
```

You should see:

```
2/2 Running
```

If it’s `1/1`, Istio ignored you.

---

## STEP 4: Expose via Istio Gateway

### Gateway

```yaml
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: app-gateway
  namespace: micro
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
```

### VirtualService

```yaml
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: frontend
  namespace: micro
spec:
  hosts:
  - "*"
  gateways:
  - app-gateway
  http:
  - route:
    - destination:
        host: frontend
        port:
          number: 3000
```

Apply and test. External access works? Good.

---

## STEP 5: Enable mTLS (real mesh moment)

### PeerAuthentication

```yaml
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: micro
spec:
  mtls:
    mode: STRICT
```

Now:

* Plain HTTP between pods = blocked
* Only Envoy → Envoy traffic allowed

Congrats, you’re officially doing security.

---

## STEP 6: DestinationRule (so mTLS actually works)

```yaml
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: backend
  namespace: micro
spec:
  host: backend
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
```

Do this for each service.

---

## STEP 7: Install Kiali (no guessing anymore)

```bash
kubectl apply -f https://raw.githubusercontent.com/istio/istio/release-1.20/samples/addons/kiali.yaml
kubectl apply -f https://raw.githubusercontent.com/istio/istio/release-1.20/samples/addons/prometheus.yaml
```

Access:

```bash
istioctl dashboard kiali
```

Now stare at the graph like a proud parent.


